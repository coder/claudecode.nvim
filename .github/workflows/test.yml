name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

# Cancel in-progress runs for pull requests when developers push
# additional changes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Unit/component tests run under LuaJIT with a mocked vim global (busted), so
  # they do not need a real Neovim binary — hence no neovim-version matrix here.
  # Real-Neovim coverage lives in the integration-tests job below.
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # Build deps: PUC Lua builds from source, and the test rocks compile C modules.
      - name: Install build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y build-essential libreadline-dev unzip

      - name: Set up mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          # --locked installs only tools listed in mise.lock, fails when an entry is missing, and never rewrites it.
          # Without it, `mise install` fills in missing lock data and downloads tools again to do it, so a slow
          # www.lua.org failed this step.
          install_args: --locked
          # mise is pinned because `--locked` rules change between releases (2026.11.0 started to require a
          # checksum). sha256 is the linux-x64 mise binary from the v2026.11.5 release.
          version: 2026.11.5
          sha256: 7a5b051d6f17d335c502f8047a5175cf3103f347d91942771c60da4e302ebcb0

      - name: Install release tooling dependencies
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: npm ci --prefix scripts

      - name: Run release tooling tests
        run: npm --prefix scripts run test:release-please-runner

      # Cache the rock tree (rebuilt from luarocks.org otherwise); a miss just rebuilds.
      - name: Cache Lua test rocks
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .luarocks
          key: luarocks-${{ runner.os }}-${{ hashFiles('mise.toml') }}

      - name: Install Lua test rocks
        run: mise run setup

      - name: Run luacheck
        run: mise run check

      - name: Run tests
        run: mise run test

      - name: Check formatting
        run: mise run format-check

      - name: Generate coverage report
        run: |
          if [ -f "luacov.stats.out" ]; then
            ./.luarocks/bin/luacov

            summary=$(mktemp)
            status=0
            awk -v root="$PWD/" '
              function emoji(percent) {
                if (percent + 0 >= 90) return "🟢"
                if (percent + 0 >= 70) return "🟡"
                return "🔴"
              }
              /^Summary$/ { in_summary = 1; next }
              !in_summary || $NF !~ /^[0-9.]+%$/ { next }
              {
                file = $0
                sub(/[ \t]+[0-9]+[ \t]+[0-9]+[ \t]+[0-9.]+%[ \t]*$/, "", file)
                if (index(file, root) == 1) file = substr(file, length(root) + 1)
                if (file == "Total") {
                  overall = $NF
                } else {
                  rows = rows "| `" file "` | " emoji($NF) " " $NF " |\n"
                  count++
                }
              }
              END {
                print "## 📊 Test Coverage Report\n"
                if (count == 0 || overall == "") {
                  print "❌ luacov.report.out has no per-file row or no Total row"
                  exit 1
                }
                print "**Overall Coverage: " overall "**\n"
                print "| File | Coverage |"
                print "|------|----------|"
                printf "%s", rows
              }
            ' luacov.report.out > "$summary" || status=$?
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          else
            {
              echo "## 📊 Test Coverage Report"
              echo ""
              echo "❌ No coverage data found - tests may not have run with coverage enabled"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      matrix:
        # v0.8.0 is the minimum that README.md and plugin/claudecode.lua support. Its release
        # binary reports `v0.8.0-1210-gd367ed9b2`: d367ed9b2 is the commit the v0.8.0 tag points to.
        neovim-version: ["stable", "v0.8.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # Neovim here comes from action-setup-vim (matrix-driven), independent of
      # the mise.toml neovim pin used for local dev.
      - name: Setup Neovim
        uses: rhysd/action-setup-vim@8e931b9954b19d4203d5caa5ff5521f3bc21dcc7 # v1.4.2
        with:
          neovim: true
          version: ${{ matrix.neovim-version }}

      - name: Install test dependencies
        env:
          # plenary.nvim's master head since 2026-04-10, which the unpinned clone fetched until now.
          # Pinned so a new plenary commit cannot change or break CI (for example by dropping 0.8).
          PLENARY_SHA: 74b06c6c75e4eeb3108ec01852001636d85a932b
        run: |
          plenary=~/.local/share/nvim/site/pack/vendor/start/plenary.nvim
          git init -q "$plenary"
          git -C "$plenary" fetch -q --depth 1 https://github.com/nvim-lua/plenary.nvim "$PLENARY_SHA"
          git -C "$plenary" checkout -q FETCH_HEAD
          git -C "$plenary" log -1 --format='plenary.nvim %H %cs'
          ln -s "$(pwd)" ~/.local/share/nvim/site/pack/vendor/start/claudecode.nvim

      - name: Run integration tests
        run: ./scripts/run_integration_tests_individually.sh

      # Real-Neovim regression gate for issue #238 (reject-with-:q). The unit spec
      # only exercises the WinClosed handler logic against a mock; this drives a
      # genuine `:q` and self-reports via cquit (exit 0 = fixed, 1 = regressed).
      # `nvim -l` needs Neovim 0.9, so the script runs through :luafile. If it raises before
      # its own cquit, the second -c exits 2.
      - name: Reject-on-quit regression gate (#238)
        run: nvim --headless -u NONE -c "luafile scripts/repro_issue_238.lua" -c "cquit 2"

  # covered.lock records the lua/ and plugin/ code that the openDiff lifecycle model was last
  # confirmed against. check.sh model-checks that lifecycle with TLC on the runner's Java, then
  # compares the lock. Advisory: Required does not need this job, so a broken rule or a stale
  # lock shows red without blocking a merge.
  covered-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The cache key comes from the version and sha256 that check.sh pins, so a new pin gets a new
      # entry. check.sh checks that sha256 on every run, a restored jar included.
      - name: Read the TLC jar that check.sh pins
        id: tlc
        run: |
          check=.agents/skills/verify-diff-lifecycle/check.sh
          version=$(sed -n 's/^TLC_VERSION=//p' "$check")
          sha256=$(sed -n 's/^TLC_SHA256=//p' "$check")
          if [[ ! $version =~ ^[0-9.]+$ || ! $sha256 =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::cannot read TLC_VERSION and TLC_SHA256 from $check"
            exit 1
          fi
          {
            echo "key=tla2tools-$version-$sha256"
            echo "jar=$HOME/.cache/claudecode-nvim-tla/tla2tools-$version.jar"
          } >>"$GITHUB_OUTPUT"

      - name: Cache the TLC jar
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.tlc.outputs.jar }}
          key: ${{ steps.tlc.outputs.key }}

      - name: Model-check the openDiff lifecycle and compare covered.lock
        env:
          TLC_JAR: ${{ steps.tlc.outputs.jar }}
        run: .agents/skills/verify-diff-lifecycle/check.sh

  required:
    name: Required
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
    if: ${{ always() }}

    steps:
      - name: Check required jobs
        env:
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_TESTS_RESULT: ${{ needs.integration-tests.result }}
        run: |
          echo "unit-tests: $UNIT_TESTS_RESULT"
          echo "integration-tests: $INTEGRATION_TESTS_RESULT"

          if [ "$UNIT_TESTS_RESULT" != "success" ] || [ "$INTEGRATION_TESTS_RESULT" != "success" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
