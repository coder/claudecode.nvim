name: Release Notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to write notes for (for example, v0.4.0)
        required: true
        type: string
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release-notes:
    name: release-notes
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Validate release inputs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COMMUNIQUE_MODEL: ${{ vars.COMMUNIQUE_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ -z "${ANTHROPIC_API_KEY:-}" && -z "${OPENAI_API_KEY:-}" ]]; then
            echo "ANTHROPIC_API_KEY or OPENAI_API_KEY is required to generate release notes with Communique." >&2
            exit 1
          fi
          if [[ -z "${ANTHROPIC_API_KEY:-}" && -z "${COMMUNIQUE_MODEL:-}" ]]; then
            echo "Set COMMUNIQUE_MODEL when using OPENAI_API_KEY so Communique can select an OpenAI-compatible model." >&2
            exit 1
          fi
          : "${GITHUB_TOKEN:?GITHUB_TOKEN is required}"
          : "${RELEASE_TAG:?release tag is required}"

          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "release tag must start with 'v': $RELEASE_TAG" >&2
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # install_args installs only communique (pinned in mise.toml), not the
      # full dev toolchain. cache: false avoids zizmor's cache-poisoning finding
      # on this publish workflow (caching saves little on a release-only job).
      - name: Set up mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          # --locked: install only from mise.lock, never rewrite it (see test.yml).
          install_args: --locked communique
          cache: false
          # mise is pinned because `--locked` rules change between releases (2026.11.0 started to require a
          # checksum). sha256 is the linux-x64 mise binary from the v2026.11.5 release.
          version: 2026.11.5
          sha256: 7a5b051d6f17d335c502f8047a5175cf3103f347d91942771c60da4e302ebcb0

      - name: Resolve previous release ref
        run: |
          set -euo pipefail

          release_commit="$(git rev-parse --verify "${RELEASE_TAG}^{commit}")"
          : "${release_commit:?release commit is required}"

          if previous_ref="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' "${release_commit}^" 2>/dev/null)"; then
            echo "Previous release tag: $previous_ref"
          else
            previous_ref="$(git rev-list --max-parents=0 "$release_commit" | head -n 1)"
            : "${previous_ref:?previous release ref is required}"
            echo "No previous release tag found; using root commit: $previous_ref"
          fi

          echo "PREVIOUS_RELEASE_REF=$previous_ref" >> "$GITHUB_ENV"

      - name: Generate GitHub release notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COMMUNIQUE_MODEL: ${{ vars.COMMUNIQUE_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          : "${PREVIOUS_RELEASE_REF:?previous release ref is required}"

          communique_args=()
          if [[ -n "${COMMUNIQUE_MODEL:-}" ]]; then
            communique_args+=(--model "$COMMUNIQUE_MODEL")
          fi

          communique generate "$RELEASE_TAG" "$PREVIOUS_RELEASE_REF" \
            --github-release --repo "${{ github.repository }}" \
            "${communique_args[@]}"
