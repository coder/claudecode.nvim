# treefmt configuration — replaces the former Nix flake `nix fmt` (treefmt-nix).
#
# Run via `mise run format` (treefmt) or `mise run format-check` (`treefmt --ci` with FORMAT_CHECK=1, which writes
# nothing to the tree). The three formatters that write files (stylua, prettier, shfmt) run through
# scripts/treefmt-formatter.sh, which holds their write flags and their check flags. Their includes and excludes stay
# here, so both modes format the same files.
# Every formatter/linter referenced here is provisioned by mise (see mise.toml).
# The tree root is the folder of this file. By default it is the root of the git repository, so a checkout without its
# own .git (a vendored copy inside another repository) would get the outer repository as its tree root. Then treefmt
# would not find scripts/treefmt-formatter.sh, and the excludes below would anchor at the outer root.
tree-root-file = "treefmt.toml"
# treefmt's git walker already skips git-ignored paths; these also guard `--walk filesystem`.
excludes = [
  ".luarocks/**",
  ".direnv/**",
]

[formatter.stylua]
command = "scripts/treefmt-formatter.sh"
options = ["stylua"]
includes = ["*.lua"]

[formatter.prettier]
command = "scripts/treefmt-formatter.sh"
options = ["prettier"]
includes = [
  "*.css",
  "*.html",
  "*.js",
  "*.json",
  "*.json5",
  "*.jsx",
  "*.markdown",
  "*.md",
  "*.mdx",
  "*.mjs",
  "*.scss",
  "*.ts",
  "*.tsx",
  "*.vue",
  "*.yaml",
  "*.yml",
]
# lazy.nvim lock files are auto-generated and reformatted by lazy on update.
excludes = ["fixtures/*/lazy-lock.json"]

[formatter.shfmt]
command = "scripts/treefmt-formatter.sh"
options = ["shfmt"]
includes = ["*.sh"]

[formatter.shellcheck]
command = "shellcheck"
options = ["--exclude=SC1091,SC2016"]
includes = ["*.sh"]

[formatter.actionlint]
command = "actionlint"
includes = [".github/workflows/*.yml", ".github/workflows/*.yaml"]

[formatter.zizmor]
command = "zizmor"
options = ["--offline"]
includes = [".github/workflows/*.yml", ".github/workflows/*.yaml"]
